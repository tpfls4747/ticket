<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>최종 확인 실패</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></span></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">최종 확인 실패</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px; overflow: hidden">
<div role="group" aria-label="{{stepper.label}}" style="display: flex; flex-direction: column; gap: 7px; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 8px; min-height: 20px"><span style="{{stepper.headStyle}}">{{stepper.head}}</span><sc-if value="{{stepper.exp}}"><span style="font-size: 11px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 2px 6px; border-radius: 4px">실험 기능</span></sc-if><span style="flex: 1"></span><sc-if value="{{stepper.hasNote}}"><span style="{{stepper.noteStyle}}">{{stepper.note}}</span></sc-if></div><ol style="margin: 0; padding: 0 2px; list-style: none; display: flex; gap: 5px"><sc-for list="{{stepper.items}}" as="st"><li aria-current="{{st.cur}}" style="flex: 1; display: flex; flex-direction: column; position: relative"><span aria-hidden="true" style="{{st.bar}}"></span><span style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0">{{st.sr}}</span></li></sc-for></ol><sc-if value="{{stepper.hasEnd}}"><span style="{{stepper.noteStyle}}">{{stepper.endNote}}</span></sc-if></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="align-self: flex-start"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #B03A3A; border: 1px solid #B03A3A; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>실패</span> <span style="font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 2px 6px; border-radius: 4px; white-space: nowrap">시연</span></span><h2 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4">최종 확인에 실패했어요</h2><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #4A4F5C">교환은 진행되지 않았어요. 내 티켓은 그대로 유지돼요 (목표).</p></div><div style="background: #FFFFFF; border-radius: 14px; padding: 4px 14px; display: flex; flex-direction: column; gap: 0px; border: 1px solid #E6E8EC"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #EEF0F3"><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 700">내 티켓</span><span style="font-size: 12px; color: #5F6370">{{mine}}</span></span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #1F7A4D; background: #E6F6EE; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg>{{keepText}}</span></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #EEF0F3"><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 700">실패 사유</span><span style="font-size: 12px; color: #5F6370">후보 티켓 상태 변경</span></span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #B03A3A; background: #FDF0F0; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B03A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>확인 실패</span></div></div>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top: 1px solid #EEF0F3"><button data-act="home" type="button" style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #5B3DF5; color: #FFFFFF; border: 0">내 티켓 확인</button><button data-act="restart" type="button" style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #FFFFFF; color: #4A4F5C; border: 1px solid #DADDE3">다시 신청</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"mine": "12.20 (일) 18:00 · 3회차 · R석 B구역 7열 12번", "keepText": "유지 (목표)", "stepper": {"items": [{"label": "조건 등록", "n": 1, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "1단계 조건 등록: 완료"}, {"label": "후보 확인", "n": 2, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "2단계 후보 확인: 완료"}, {"label": "비교·제안", "n": 3, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "3단계 비교·제안: 완료"}, {"label": "상대 수락", "n": 4, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "4단계 상대 수락: 완료"}, {"label": "최종 확인", "n": 5, "bar": "display: block; height: 6px; border-radius: 3px; background: #B03A3A", "cur": "false", "sr": "5단계 최종 확인: 실패"}, {"label": "교환 완료", "n": 6, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "6단계 교환 완료: 남은 단계"}], "head": "단계 5/6 · 최종 확인", "headStyle": "font-size: 14px; font-weight: 700; color: #B03A3A", "note": "", "hasNote": false, "endNote": "", "hasEnd": false, "noteStyle": "font-size: 12px; font-weight: 700; color: #B03A3A", "exp": false, "label": "진행 단계: 단계 5/6 · 최종 확인"}};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.failed) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
