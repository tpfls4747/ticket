<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교환 전후 비교</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></span></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">교환 전후 비교</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 20px 16px; overflow: hidden">
<p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #5F6370">정보가 없으면 추정하지 않고 &#39;확인 필요&#39;로 표시해요. 시연용 모의 데이터예요.</p><div style="display: flex; flex-direction: column"><div style="display: grid; grid-template-columns: 62px 1fr 1fr; gap: 8px; padding-bottom: 6px"><span></span><span style="font-size: 11px; font-weight: 700; color: #5F6370">내 티켓 (지금)</span><span style="font-size: 11px; font-weight: 700; color: #3A26C4">받게 될 티켓</span></div><sc-for list="{{rows}}" as="r"><div style="display: grid; grid-template-columns: 62px 1fr 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid #EEF0F3; align-items: start"><span style="font-size: 12px; font-weight: 700; color: #5F6370">{{r.label}}</span><span style="font-size: 12px; line-height: 1.4">{{r.a}}</span><span style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 1.4; font-weight: 700">{{r.b}}<sc-if value="{{r.k_ok}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #1F7A4D; background: #E6F6EE; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg>{{r.text}}</span></sc-if><sc-if value="{{r.k_plan}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #3A26C4; background: #E9E5FF; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3A26C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="4"/></svg>{{r.text}}</span></sc-if><sc-if value="{{r.k_no}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #B03A3A; background: #FDF0F0; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B03A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>{{r.text}}</span></sc-if><sc-if value="{{r.k_mute}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A4F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 12h12"/></svg>{{r.text}}</span></sc-if><sc-if value="{{r.k_need}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 17h.01"/></svg>{{r.text}}</span></sc-if></span></div></sc-for></div><label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: #191B22"><input type="checkbox" data-act="consent" key="{{consentKey}}" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 0; flex-shrink: 0">이 조건으로 교환하는 데 동의해요 (내 수락)</label>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top: 1px solid #EEF0F3"><sc-if value="{{canSend}}"><button data-act="send" type="button" style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #5B3DF5; color: #FFFFFF; border: 0">교환 제안 보내기</button></sc-if><sc-if value="{{cantSend}}"><button type="button" disabled style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #E6E8EC; color: #8B909C; border: 0">교환 제안 보내기</button></sc-if><sc-if value="{{sendHint}}"><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 700; color: #A3440B">{{sendHint}}</p></sc-if><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #5F6370">제안을 보내도 교환은 확정되지 않아요. 상대방이 수락하고 최종 확인을 통과해야 완료돼요.</p></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"rows": [{"label": "공연명", "a": "2026 Blue Hour 단독 콘서트", "b": "2026 Blue Hour 단독 콘서트", "text": "같음", "k_ok": false, "k_plan": false, "k_no": false, "k_mute": true, "k_need": false}, {"label": "날짜·회차", "a": "12.20 (일) 18:00 · 3회차", "b": "12.21 (월) 14:00 · 4회차", "text": "다름", "k_ok": false, "k_plan": true, "k_no": false, "k_mute": false, "k_need": false}, {"label": "구역", "a": "R석 B구역", "b": "R석 A구역", "text": "다름", "k_ok": false, "k_plan": true, "k_no": false, "k_mute": false, "k_need": false}, {"label": "열·좌석", "a": "7열 12번", "b": "5열 8번", "text": "다름", "k_ok": false, "k_plan": true, "k_no": false, "k_mute": false, "k_need": false}, {"label": "캐스팅", "a": "해당 없음", "b": "해당 없음", "text": "같음", "k_ok": false, "k_plan": false, "k_no": false, "k_mute": true, "k_need": false}, {"label": "권종·가격", "a": "R석 · 154,000원 (가상)", "b": "R석 · 가격 정보 없음", "text": "확인 필요", "k_ok": false, "k_plan": false, "k_no": false, "k_mute": false, "k_need": true}, {"label": "정책 확인", "a": "시연 판정: 교환 가능", "b": "정책 확인 상태 없음", "text": "확인 필요", "k_ok": false, "k_plan": false, "k_no": false, "k_mute": false, "k_need": true}], "consentKey": "consent-0", "canSend": true, "cantSend": false, "sendHint": ""};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.compare) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
