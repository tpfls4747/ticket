<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>최종 확인</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></span></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">최종 확인</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="align-self: flex-start"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>최종 확인 중</span> <span style="font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 2px 6px; border-radius: 4px; white-space: nowrap">시연용 모의 데이터</span></span><h2 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4">마지막으로 확인하고 있어요</h2><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #4A4F5C">이 단계가 끝나야 &#39;교환 완료&#39;가 표시돼요.</p></div><ul style="margin: 0; padding: 14px; list-style: none; display: flex; flex-direction: column; gap: 12px; border: 1px solid #E6E8EC; border-radius: 16px"><li style="display: flex; gap: 10px; align-items: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #E6F6EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13px">두 티켓이 모두 유효한지</b><span style="font-size: 12px; color: #5F6370">확인됨 (모의)</span></span></li><li style="display: flex; gap: 10px; align-items: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #E6F6EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13px">양쪽 수락이 그대로인지</b><span style="font-size: 12px; color: #5F6370">확인됨 (모의)</span></span></li><li style="display: flex; gap: 10px; align-items: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFF1E6; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13px">교환 정책 확인 상태</b><span style="font-size: 12px; color: #5F6370">확인 중 (모의)</span></span></li><li style="display: flex; gap: 10px; align-items: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #F0F1F4; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5F6370" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 12h12"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13px">새 티켓 준비</b><span style="font-size: 12px; color: #5F6370">앞 단계가 끝나면 시작해요</span></span></li></ul><div style="background: #F0EDFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; "><div style="display: flex; gap: 6px; align-items: center"><span style="font-size: 11px; font-weight: 700; color: #3A26C4; background: #E9E5FF; padding: 2px 6px; border-radius: 4px; white-space: nowrap">목표 UX</span><b style="font-size: 12px">하나라도 실패하면</b></div><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #4A4F5C">교환은 진행되지 않고 원래 티켓이 유지되는 것을 목표로 해요. 목표 UX와 시스템 요구사항이며, 이 프로토타입은 실제 티켓을 처리하지 않아요.</p></div>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top: 1px solid #EEF0F3"><button type="button" disabled style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #EEF0F3; color: #5F6370; border: 1.5px dashed #9AA0AC"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>확인이 끝나면 알려드려요</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
