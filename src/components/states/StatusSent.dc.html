<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교환 진행 현황</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></span></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">교환 진행 현황</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="align-self: flex-start"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>상대방 검토 중</span> <span style="font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 2px 6px; border-radius: 4px; white-space: nowrap">시연용 모의 데이터</span></span><h2 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4">제안을 보냈어요</h2><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #4A4F5C">{{sub}}</p></div><ol aria-label="진행 단계" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column"><sc-for list="{{steps}}" as="s"><li style="position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px"><sc-if value="{{s.hasLine}}"><span style="position: absolute; left: 10px; top: 24px; bottom: -8px; width: 2px; background: #E6E8EC"></span></sc-if><sc-if value="{{s.done}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1F7A4D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg></span></sc-if><sc-if value="{{s.now}}"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #5B3DF5; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5B3DF5"></span></span></sc-if><sc-if value="{{s.todo}}"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #DADDE3; background: #FFFFFF; box-sizing: border-box; flex-shrink: 0"></span></sc-if><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700; color: {{s.color}}">{{s.label}} <span style="font-size: 11px; font-weight: 500; color: {{s.color}}">· {{s.stText}}</span></span><span style="font-size: 12px; line-height: 1.45; color: #5F6370">{{s.sub}}</span></span></li></sc-for></ol>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top: 1px solid #EEF0F3"><button data-act="cancel" type="button" style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #FFFFFF; color: #4A4F5C; border: 1px solid #DADDE3">제안 취소하기</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"steps": [{"label": "교환 신청", "sub": "조건 등록 완료", "done": true, "now": false, "todo": false, "hasLine": true, "color": "#191B22", "stText": "완료"}, {"label": "후보 확인", "sub": "양방향 조건 확인 통과", "done": true, "now": false, "todo": false, "hasLine": true, "color": "#191B22", "stText": "완료"}, {"label": "교환 제안 보내기", "sub": "비교 화면에서 내 동의 완료", "done": true, "now": false, "todo": false, "hasLine": true, "color": "#191B22", "stText": "완료"}, {"label": "상대방 검토", "sub": "응답 기한은 가상 규칙이에요 (예: 12시간)", "done": false, "now": true, "todo": false, "hasLine": true, "color": "#3A26C4", "stText": "지금 단계"}, {"label": "제안 수락", "sub": "상대방이 제안을 수락해야 다음으로 가요", "done": false, "now": false, "todo": true, "hasLine": true, "color": "#8B909C", "stText": "남은 단계"}, {"label": "최종 확인 중", "sub": "티켓·조건을 마지막으로 확인해요", "done": false, "now": false, "todo": true, "hasLine": true, "color": "#8B909C", "stText": "남은 단계"}, {"label": "교환 완료", "sub": "최종 확인을 통과해야 표시돼요", "done": false, "now": false, "todo": true, "hasLine": false, "color": "#8B909C", "stText": "남은 단계"}], "sub": "상대방이 검토하는 동안 내 티켓은 그대로 유효해요."};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.sent) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
