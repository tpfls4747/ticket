<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교환 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 72px 20px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 32px; background: #5B3DF5; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">교환이 완료됐어요</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5F6370">새 티켓이 발급됐어요 (시연).<br>입장할 때는 새 모바일 티켓을 보여주세요.</p>
</div>
<section style="background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 700">2026 Blue Hour 단독 콘서트</span>
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #5B3DF5; padding: 3px 8px; border-radius: 6px">NEW</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: 72px 1fr; row-gap: 10px; font-size: 15px">
<dt style="color: #5F6370">관람일</dt>
<dd style="margin: 0; font-weight: 700">{{date}}</dd>
<dt style="color: #5F6370">좌석</dt>
<dd style="margin: 0; font-weight: 700">{{seat}}</dd>
<dt style="color: #5F6370">예매번호</dt>
<dd style="margin: 0; font-weight: 500">{{booking}}</dd>
</dl>
</div>
<div style="height: 0; border-top: 2px dashed #E6E8EC; margin: 0 16px"></div>
<div style="padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 500; color: #6B7080">이전 티켓 · 무효 처리됨</span>
<span style="font-size: 14px; color: #6B7080; text-decoration: line-through">{{prev}}</span>
</div>
</section>
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6370" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A4F5C">교환은 공연당 1회 (가상 규칙) · 취소 수수료는 공연별 안내를 확인하세요.</p>
</div>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<button style="height: 54px; border: none; border-radius: 14px; background: #5B3DF5; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">모바일 티켓 보기</button>
<a href="Main.dc.html" data-act="home" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5F6370">예매 내역으로</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"date": "12.21 (월) 14:00 · 4회차", "seat": "R석 · A구역 5열 8번", "booking": "T26112-0839", "prev": "12.20 (일) 18:00 · B구역 7열 12번"};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.done) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
