<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교환 조건 등록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">교환 조건 등록</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 13px; padding: 4px 20px 12px; overflow: hidden">
<div role="group" aria-label="{{stepper.label}}" style="display: flex; flex-direction: column; gap: 7px; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 8px; min-height: 20px"><span style="{{stepper.headStyle}}">{{stepper.head}}</span><sc-if value="{{stepper.exp}}"><span style="font-size: 11px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 2px 6px; border-radius: 4px">실험 기능</span></sc-if><span style="flex: 1"></span><sc-if value="{{stepper.hasNote}}"><span style="{{stepper.noteStyle}}">{{stepper.note}}</span></sc-if></div><ol style="margin: 0; padding: 0 2px; list-style: none; display: flex; gap: 5px"><sc-for list="{{stepper.items}}" as="st"><li aria-current="{{st.cur}}" style="flex: 1; display: flex; flex-direction: column; position: relative"><span aria-hidden="true" style="{{st.bar}}"></span><span style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0">{{st.sr}}</span></li></sc-for></ol><sc-if value="{{stepper.hasEnd}}"><span style="{{stepper.noteStyle}}">{{stepper.endNote}}</span></sc-if></div><div style="background: #F5F6F8; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 500; color: #5F6370">내 티켓</span>
<span style="font-size: 15px; font-weight: 700">12.20 (일) 18:00 · R석 B구역 7열 12번</span>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">원하는 회차</h2>
<span style="{{roundSeg.wrap}}"><sc-for list="{{roundSeg.items}}" as="b"><button type="button" data-act="imp" data-row="{{b.row}}" data-val="{{b.name}}" aria-pressed="{{b.pressed}}" style="{{b.style}}">{{b.name}}</button></sc-for></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{rounds}}" as="r"><button data-act="round" data-val="{{r.val}}" aria-pressed="{{r.pressed}}" disabled="{{r.disabled}}" style="{{r.style}}">{{r.label}}<sc-if value="{{r.sub}}"><span style="font-size: 11px">{{r.sub}}</span></sc-if></button></sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">원하는 구역</h2>
<span style="{{zoneSeg.wrap}}"><sc-for list="{{zoneSeg.items}}" as="b"><button type="button" data-act="imp" data-row="{{b.row}}" data-val="{{b.name}}" aria-pressed="{{b.pressed}}" style="{{b.style}}">{{b.name}}</button></sc-for></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{zones}}" as="z"><button data-act="zone" data-val="{{z.val}}" aria-pressed="{{z.pressed}}" style="{{z.style}}">{{z.label}}</button></sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">원하는 열</h2>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 700; color: #3A26C4">{{rowLabel}}</span><span style="{{rowSeg.wrap}}"><sc-for list="{{rowSeg.items}}" as="b"><button type="button" data-act="imp" data-row="{{b.row}}" data-val="{{b.name}}" aria-pressed="{{b.pressed}}" style="{{b.style}}">{{b.name}}</button></sc-for></span></span>
</div>
<div style="position: relative; height: 24px; display: flex; align-items: center">
<div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: #E6E8EC"></div>
<div style="position: absolute; left: 0; width: {{rowPct}}; height: 6px; border-radius: 3px; background: #5B3DF5"></div>
<div style="position: absolute; left: 0; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; border: 2px solid #5B3DF5; box-sizing: border-box"></div>
<div style="position: absolute; left: calc({{rowPct}} - 12px); width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; border: 2px solid #5B3DF5; box-sizing: border-box"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5F6370"><span>1열</span><sc-if value="{{showStep}}"><span style="display: flex; align-items: center; gap: 6px"><button type="button" data-act="rowMinus" aria-label="열 범위 줄이기" disabled="{{cantMinus}}" style="width: 28px; height: 24px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #4A4F5C; padding: 0">−</button><span style="font-size: 12px; font-weight: 700; color: #3A26C4">{{stepLabel}}</span><button type="button" data-act="rowPlus" aria-label="열 범위 늘리기" disabled="{{cantPlus}}" style="width: 28px; height: 24px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #4A4F5C; padding: 0">+</button></span></sc-if><span>20열</span></div>
</section>
<section style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-size: 16px; font-weight: 700">캐스팅</h2><span style="font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 2px 6px; border-radius: 4px; white-space: nowrap">이 공연은 해당 없음</span></section>
<div style="{{noteBox}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6370" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<p style="{{noteText}}">{{note}}</p>
</div>
</main>
<footer style="padding: 12px 20px 28px; flex-shrink: 0; border-top: 1px solid #EEF0F3">
<sc-if value="{{valid}}"><a href="Waiting.dc.html" data-act="submit" style="height: 54px; border-radius: 14px; background: #5B3DF5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">교환 신청 등록</a></sc-if><sc-if value="{{invalid}}"><button type="button" disabled style="width: 100%; height: 54px; border-radius: 14px; background: #EEF0F3; color: #5F6370; border: 1.5px dashed #9AA0AC; font-family: inherit; font-size: 16px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>교환 신청 등록</button></sc-if>
</footer>
</div>
</x-dc>
