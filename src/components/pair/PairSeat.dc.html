<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>연석 만들기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<a href="PairMode.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">연석 만들기</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 0 20px 12px; overflow: hidden">
<section aria-label="B구역 좌석 배치" style="background: #F5F6F8; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; align-items: center">
<span style="font-size: 12px; font-weight: 700; color: #4A4F5C; margin-bottom: 4px">B구역 · 무대 방향 ↑</span>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 4px">
<span style="width: 34px; font-size: 10px; color: #5F6370; text-align: right; padding-right: 4px">{{row.label}}</span>
<sc-for list="{{row.seats}}" as="seat" hint-placeholder-count="14">
<sc-if value="{{seat.mine}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 16px; border-radius: 4px; background: #5B3DF5"></span></sc-if>
<sc-if value="{{seat.cand}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 16px; border-radius: 4px; background: #FFE3CC; border: 2px solid #D9620F; box-sizing: border-box"></span></sc-if>
<sc-if value="{{seat.other}}" hint-placeholder-val="{{true}}"><span style="width: 16px; height: 16px; border-radius: 4px; background: #DADDE3"></span></sc-if>
</sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 14px; font-size: 11px; color: #4A4F5C; margin-top: 8px">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5B3DF5"></span>내 좌석</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FFE3CC; border: 2px solid #D9620F; box-sizing: border-box"></span>제안 보낼 옆자리</span>
</div>
</section>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 16px; font-weight: 700; padding: 0; margin-bottom: 10px">어느 쪽으로 모을까요?</legend>
<label style="display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 14px">
<input type="radio" name="dir" checked style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">11열로 모으기 → 11열 3·4번 또는 4·5번</span><span style="font-size: 13px; line-height: 1.5; color: #4A4F5C">옆자리 관객이 7열 12번으로 옮겨 가요. 같은 R석이지만 좌석 위치는 바뀌어요</span><span style="align-self: flex-start; font-size: 11px; font-weight: 700; color: #4A4F5C; background: #EEF0F3; padding: 2px 6px; border-radius: 4px; margin-top: 2px">상대 좌석 변경</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; border: 1px solid #DADDE3; border-radius: 14px; padding: 14px">
<input type="radio" name="dir" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">7열로 모으기 → 7열 11·12번 또는 12·13번</span><span style="font-size: 13px; line-height: 1.5; color: #5F6370">옆자리 관객이 11열 4번으로 옮겨야 해요. 같은 R석이지만 좌석 위치는 바뀌어요</span></span>
</label>
</fieldset>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5F6370">교환 의향을 등록했거나 제안 수신에 동의한 관객에게만 제안해요 (설계 가정). 동행석이 분리될 수 있어요. 먼저 수락한 관객과 최종 확인 후 교환돼요.</p>
</main>
<footer style="padding: 12px 20px 28px; flex-shrink: 0; border-top: 1px solid #EEF0F3">
<a href="PairReceive.dc.html" style="height: 54px; border-radius: 14px; background: #5B3DF5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">동의한 옆자리에 제안 보내기</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const mine = { '7-12': 1, '11-4': 1 };
const cand = { '11-3': 1, '11-5': 1, '7-11': 1, '7-13': 1 };
const rows = [];
for (let r = 5; r <= 12; r++) {
const seats = [];
for (let s = 1; s <= 14; s++) {
const k = r + '-' + s;
const isMine = !!mine[k];
const isCand = !isMine && !!cand[k];
seats.push({ mine: isMine, cand: isCand, other: !isMine && !isCand });
}
rows.push({ label: r + '열', seats: seats });
}
return { rows: rows };
}
}
</script>
</body>
</html>
