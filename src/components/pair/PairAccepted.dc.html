<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>연석 교환 진행 현황</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></span></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">연석 교환 진행 현황</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="align-self: flex-start"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #1F7A4D; background: #E6F6EE; padding: 4px 8px; border-radius: 6px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg>제안 수락</span> <span style="font-size: 11px; font-weight: 700; color: #4A4F5C; background: #F0F1F4; padding: 2px 6px; border-radius: 4px; white-space: nowrap">시연</span></span><h2 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4">옆자리 관객이 제안을 수락했어요</h2></div><div style="display: flex; gap: 8px; align-items: flex-start; background: #FFF1E6; border-radius: 12px; padding: 10px 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><p style="margin: 0; font-size: 12px; line-height: 1.5; color: #A3440B">아직 교환이 완료된 것은 아니에요. 최종 확인 전까지 내 좌석은 그대로예요.</p></div><div style="border: 1px solid #E6E8EC; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; color: #5F6370">내 좌석 (지금 · 유효)</span><span style="font-size: 13px; font-weight: 500">{{now}}</span></div><div style="border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; color: #3A26C4">최종 확인을 통과하면</span><span style="font-size: 13px; font-weight: 500">{{after}}</span></div><ol aria-label="진행 단계" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column"><li style="position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px"><span style="position: absolute; left: 10px; top: 24px; bottom: -8px; width: 2px; background: #E6E8EC"></span><span style="width: 22px; height: 22px; border-radius: 11px; background: #1F7A4D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L19 7"/></svg></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700; color: #191B22">교환 제안 보내기 <span style="font-size: 11px; font-weight: 500; color: #191B22">· 완료</span></span><span style="font-size: 12px; line-height: 1.45; color: #5F6370"></span></span></li><li style="position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px"><span style="position: absolute; left: 10px; top: 24px; bottom: -8px; width: 2px; background: #E6E8EC"></span><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #5B3DF5; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5B3DF5"></span></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700; color: #3A26C4">제안 수락 <span style="font-size: 11px; font-weight: 500; color: #3A26C4">· 지금 단계</span></span><span style="font-size: 12px; line-height: 1.45; color: #5F6370"></span></span></li><li style="position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px"><span style="position: absolute; left: 10px; top: 24px; bottom: -8px; width: 2px; background: #E6E8EC"></span><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #DADDE3; background: #FFFFFF; box-sizing: border-box; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700; color: #8B909C">최종 확인 중 <span style="font-size: 11px; font-weight: 500; color: #8B909C">· 남은 단계</span></span><span style="font-size: 12px; line-height: 1.45; color: #5F6370"></span></span></li><li style="position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #DADDE3; background: #FFFFFF; box-sizing: border-box; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700; color: #8B909C">교환 완료 <span style="font-size: 11px; font-weight: 500; color: #8B909C">· 남은 단계</span></span><span style="font-size: 12px; line-height: 1.45; color: #5F6370">최종 확인을 통과해야 표시돼요</span></span></li></ol>
</main>
<footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top: 1px solid #EEF0F3"><button data-act="cancel" type="button" style="height: 50px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; background: #FFFFFF; color: #4A4F5C; border: 1px solid #DADDE3">교환 취소하기 (최종 확인 전)</button><p style="margin: 0; font-size: 12px; line-height: 1.5; font-weight: 400; color: #5F6370">실패하면 원래 좌석을 유지해요 (목표).</p></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"stepperDeclined": {"items": [{"label": "교환 방식", "n": 1, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "1단계 교환 방식: 완료"}, {"label": "유지할 좌석", "n": 2, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "2단계 유지할 좌석: 완료"}, {"label": "인접 확인", "n": 3, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "3단계 인접 확인: 완료"}, {"label": "비교·제안", "n": 4, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5", "cur": "false", "sr": "4단계 비교·제안: 완료"}, {"label": "상대 수락", "n": 5, "bar": "display: block; height: 6px; border-radius: 3px; background: #B03A3A", "cur": "false", "sr": "5단계 상대 수락: 실패"}, {"label": "최종 확인", "n": 6, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "6단계 최종 확인: 남은 단계"}], "head": "단계 5/6 · 상대 수락", "headStyle": "font-size: 14px; font-weight: 700; color: #B03A3A", "note": "", "hasNote": false, "endNote": "", "hasEnd": false, "noteStyle": "font-size: 12px; font-weight: 700; color: #B03A3A", "exp": true, "label": "진행 단계: 단계 5/6 · 상대 수락"}, "now": "7열 12번 · 11열 4번", "after": "11열 4번, 5번", "cand": "11열 5번", "candLabel": "옆자리 후보 · 오른쪽"};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.after) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
