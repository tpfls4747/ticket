<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교환 방식 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #191B22; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0">
<sc-if value="{{notDemo}}"><a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a></sc-if><sc-if value="{{isDemo}}"><button type="button" data-act="back" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 18l-6-6 6-6"/></svg></button></sc-if>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">교환 신청</h1>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 8px 20px 16px; overflow: hidden">
<div role="group" aria-label="{{stepper.label}}" style="display: flex; flex-direction: column; gap: 7px; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 8px; min-height: 20px"><span style="{{stepper.headStyle}}">{{stepper.head}}</span><sc-if value="{{stepper.exp}}"><span style="font-size: 11px; font-weight: 700; color: #A3440B; background: #FFF1E6; padding: 2px 6px; border-radius: 4px">실험 기능</span></sc-if><span style="flex: 1"></span><sc-if value="{{stepper.hasNote}}"><span style="{{stepper.noteStyle}}">{{stepper.note}}</span></sc-if></div><ol style="margin: 0; padding: 0 2px; list-style: none; display: flex; gap: 5px"><sc-for list="{{stepper.items}}" as="st"><li aria-current="{{st.cur}}" style="flex: 1; display: flex; flex-direction: column; position: relative"><span aria-hidden="true" style="{{st.bar}}"></span><span style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0">{{st.sr}}</span></li></sc-for></ol><sc-if value="{{stepper.hasEnd}}"><span style="{{stepper.noteStyle}}">{{stepper.endNote}}</span></sc-if></div><div style="display: flex; gap: 8px; align-items: flex-start; background: #F0EDFF; border-radius: 12px; padding: 10px 12px; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A26C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #3A26C4">2장 중 한 장은 <b>유지할 좌석</b>으로 두고, 다른 한 장을 <b>교환에 제공할 좌석</b>으로 옆자리 관객 좌석과 바꿔요. 유지할 좌석은 다음 단계에서 골라요.</p></div><section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">교환할 티켓</h2>
<span style="font-size: 13px; color: #5F6370">12.20 (일) 18:00 · 2매</span>
</div>
<sc-if value="{{notDemo}}"><label style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 14px 16px">
<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">R석 · B구역 7열 12번</span><span style="font-size: 12px; color: #5F6370">티켓 1</span></span>
</label>
<label style="display: flex; align-items: center; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 14px 16px">
<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">R석 · B구역 11열 4번</span><span style="font-size: 12px; color: #5F6370">티켓 2</span></span>
</label></sc-if><sc-if value="{{isDemo}}"><sc-for list="{{tickets}}" as="t"><label style="{{t.style}}"><input type="checkbox" data-act="pick" data-val="{{t.val}}" checked="{{t.checked}}" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 0"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{t.title}}</span><span style="font-size: 12px; color: #5F6370">{{t.sub}}</span></span></label></sc-for></sc-if>
<p style="margin: 0; font-size: 13px; color: #A3440B; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3440B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>두 좌석이 떨어져 있어요</p>
</section>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 16px; font-weight: 700; padding: 0; margin-bottom: 12px">어떻게 바꿀까요?</legend>
<sc-if value="{{notDemo}}"><label style="display: flex; align-items: flex-start; gap: 12px; border: 1px solid #DADDE3; border-radius: 16px; padding: 16px">
<input type="radio" name="mode" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">좌석·회차 교환</span><span style="font-size: 13px; line-height: 1.5; color: #5F6370">원하는 회차·구역·열을 정해 두고, 조건에 맞는 상대를 기다려요</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 16px; padding: 16px">
<input type="radio" name="mode" checked style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">연석 만들기<span style="font-size: 11px; font-weight: 700; color: #3A26C4; background: #E3DDFF; padding: 2px 6px; border-radius: 4px">실험 기능</span></span><span style="font-size: 13px; line-height: 1.5; color: #4A4F5C">떨어진 2장을 나란히 붙여요. '교환 제안 받기'를 켠 옆자리 관객에게만 제안을 보내요 (수요 미검증)</span></span>
</label></sc-if><sc-if value="{{isDemo}}"><label style="{{generalStyle}}">
<input type="radio" name="mode" data-act="mode" data-val="general" checked="{{generalChecked}}" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">좌석·회차 교환</span><span style="font-size: 13px; line-height: 1.5; color: #5F6370">원하는 회차·구역·열을 정해 두고, 조건에 맞는 상대를 기다려요</span></span>
</label><label style="{{pairStyle}}">
<input type="radio" name="mode" data-act="mode" data-val="pair" checked="{{pairChecked}}" style="width: 20px; height: 20px; accent-color: #5B3DF5; margin: 2px 0 0">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">연석 만들기<span style="font-size: 11px; font-weight: 700; color: #3A26C4; background: #E3DDFF; padding: 2px 6px; border-radius: 4px">실험 기능</span></span><span style="font-size: 13px; line-height: 1.5; color: #4A4F5C">떨어진 2장을 나란히 붙여요. '교환 제안 받기'를 켠 옆자리 관객에게만 제안을 보내요 (수요 미검증)</span></span>
</label></sc-if>
</fieldset>
<sc-if value="{{hasHint}}"><p role="status" style="margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: #A3440B; background: #FFF1E6; border-radius: 12px; padding: 10px 12px">{{hint}}</p></sc-if>
</main>
<footer style="padding: 12px 20px 28px; flex-shrink: 0; border-top: 1px solid #EEF0F3">
<a href="PairSeat.dc.html" data-act="next" style="height: 54px; border-radius: 14px; background: #5B3DF5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">다음</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DEFAULT_VIEW = {"stepper": {"items": [{"label": "교환 방식", "n": 1, "bar": "display: block; height: 6px; border-radius: 3px; background: #5B3DF5; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #5B3DF5", "cur": "step", "sr": "1단계 교환 방식: 현재 단계"}, {"label": "유지할 좌석", "n": 2, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "2단계 유지할 좌석: 남은 단계"}, {"label": "인접 확인", "n": 3, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "3단계 인접 확인: 남은 단계"}, {"label": "비교·제안", "n": 4, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "4단계 비교·제안: 남은 단계"}, {"label": "상대 수락", "n": 5, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "5단계 상대 수락: 남은 단계"}, {"label": "최종 확인", "n": 6, "bar": "display: block; height: 6px; border-radius: 3px; background: #E6E8EC", "cur": "false", "sr": "6단계 최종 확인: 남은 단계"}], "head": "단계 1/6 · 교환 방식", "headStyle": "font-size: 14px; font-weight: 700; color: #3A26C4", "note": "다음: 유지할 좌석", "hasNote": true, "endNote": "", "hasEnd": false, "noteStyle": "font-size: 12px; font-weight: 700; color: #5F6370", "exp": true, "label": "진행 단계: 단계 1/6 · 교환 방식"}, "tickets": [{"val": "7-12", "title": "R석 · B구역 7열 12번", "sub": "티켓 1 · 교환 가능 (시연 판정)", "checked": true, "style": "display: flex; align-items: center; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 12px 16px"}, {"val": "11-4", "title": "R석 · B구역 11열 4번", "sub": "티켓 2 · 교환 가능 (시연 판정)", "checked": true, "style": "display: flex; align-items: center; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 14px; padding: 12px 16px"}], "pairChecked": true, "generalChecked": false, "pairStyle": "display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid #5B3DF5; background: #F7F5FF; border-radius: 16px; padding: 14px 16px", "generalStyle": "display: flex; align-items: flex-start; gap: 12px; border: 1px solid #DADDE3; border-radius: 16px; padding: 14px 16px", "hint": "", "hasHint": false};
class Component extends DCLogic {
renderVals() {
var d = this.props.demo;
var v = (d && d.mode) || DEFAULT_VIEW;
var o = {};
for (var k in v) o[k] = v[k];
o.isDemo = !!(d && d.isDemo);
o.notDemo = !o.isDemo;
return o;
}
}
</script>
</body>
</html>
